name: Monitor Yodobashi comments (gamenv.net)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Xuất file debug (HTML, ảnh chụp màn hình, JSON)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gamenv-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Run monitor
        run: python monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_COOKIE: ${{ secrets.SITE_COOKIE }}
          DEBUG_DUMP: ${{ github.event.inputs.debug == 'true' && 'true' || 'false' }}
          TARGET_URL: "https://gamenv.net/tc/yodobashi/"
          # SEND_ON_FIRST_RUN: "false"
          # IGNORE_IDS: "123,456"
          # BRANCH_MAP_JSON: '{"fuji\\.png":"Yodobashi Akiba"}'

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "chore: update state" && git push)

      - name: Upload debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
